services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handl
      POSTGRES_PASSWORD: handl
      POSTGRES_DB: handl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handl"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing local/handl-documents; mc anonymous set none local/handl-documents"]
  api:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["sh", "/app/scripts/start-api.sh"]
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  worker:
    build: ./backend
    environment:
      TORCHDYNAMO_DISABLE: "1"
      HF_HOME: /home/appuser/.cache/huggingface
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--queues=celery,document_parse,document_extract,webhooks,exports"]
    volumes:
      - ./backend:/app
      - docling_cache_v2:/home/appuser/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
  docling_cache_v2:
