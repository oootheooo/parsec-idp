[project]
name = "handl-parse"
version = "0.1.0"
description = "Parse (Handl Parse) document intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1",
  "alembic>=1.14,<2", "argon2-cffi>=23.1,<26", "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3", "celery[redis]>=5.4,<6",
  "boto3>=1.35,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "cryptography>=44,<47",
  "PyMuPDF>=1.25,<2", "Pillow>=11,<13", "pytesseract>=0.3.13,<1",
  "openai>=1.60,<3", "python-json-logger>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2"]
docling = ["docling>=2.20,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = "app.api"
ignore_errors = true
